# Builds and tests every pull request and every push to main. Its `verify` job
# is the check main's protection requires.
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Maven's downloads are kept between runs, keyed on pom.xml and the month. When
      # pom.xml changes, as every version bump does, the restore key starts from main's
      # last copy, so Maven fetches only what's new and Central doesn't throttle us
      # (HTTP 429). A new month starts a fresh copy from Central, so nothing in it lasts past the month.
      - name: Cache month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ steps.month.outputs.month }}-
      - run: mvn -B verify
      - name: Smoke test the jar
        run: |
          java -jar target/faux-person-web.jar --server.port=18080 > app.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:18080/faux-person-web/health >/dev/null 2>&1 && break; sleep 1; done
          scripts/smoke.sh http://127.0.0.1:18080/faux-person-web || { cat app.log; exit 1; }
      # cfn-lint and each of its dependencies install only if their hashes match
      # .github/requirements/cfn-lint.txt, which says how to regenerate it. Wheels
      # only, because pip doesn't hash-check the tools it would use to build one.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the template
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r .github/requirements/cfn-lint.txt
          cfn-lint infra/host.yaml
