# faux-person-web. Any of these can be set the Spring Boot ways, such as a
# command-line argument (--faux.web.max-count=5000) or an environment variable
# (FAUX_WEB_MAX_COUNT=5000). On the server, environment variables go in
# deploy/env/<environment>.env, which the next production
# deploy installs.

# The count when a request gives none.
faux.web.default-count=100
# The most rows one request may ask for.
faux.web.max-count=10000
# The rows the row and sorted caches hold together, in memory only.
faux.web.cache.max-rows=200000
# The bytes of finished CSV, pipe, tab and JSON bodies the body cache holds (64 MB).
faux.web.cache.max-body-bytes=67108864
# How many cache misses (generating, sorting, writing a file) run at once, and
# how long one waits for its turn before the answer is 503 Service Unavailable.
faux.web.max-concurrent=4
faux.web.max-wait-millis=2000
# The build: the app's version, faux-person's, the commit, and the build time
# (UTC). Part of every ETag, so a build from another commit or
# another minute never matches an earlier one's.
faux.web.version=@project.version@+faux-person-@faux-person.version@+@build.id@+@build.time@
# The version and build time under the page's table.
faux.web.build-label=v@project.version@ [@build.time@]

# nginx is the only way in. Production uses 8080, staging 8081.
server.address=127.0.0.1
server.port=8080
server.servlet.context-path=/faux-person-web
# nginx sets X-Forwarded-Proto and Host, so links and the cURL command say https://apps.tauasa.org.
server.forward-headers-strategy=native

# Threads to serve requests, and connections queued when all are busy. nginx
# allows each client 4 connections; these cap what many clients can hold.
server.tomcat.threads.max=32
server.tomcat.accept-count=64

spring.main.banner-mode=off
spring.thymeleaf.cache=true
server.error.include-stacktrace=never
server.error.include-message=never
