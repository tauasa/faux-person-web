# apps.tauasa.org: HTTPS in front of faux-person-web's two environments.
# deploy/install.sh installs it into /etc/nginx/conf.d/ once the certificate exists.
# Before that, apps.tauasa.org.http.conf serves only Let's Encrypt's checks.
#
# IPv4 only: the instance has no IPv6 address, and the per-client limits below
# key on the client's address, which for IPv6 would need a /64 key.

# Per client address: 10 requests a second with bursts of 10, then 429; and at
# most 4 connections open at once. Production and staging have separate limits,
# so traffic to one doesn't use up the other's.
limit_req_zone $binary_remote_addr zone=fpw_req_production:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fpw_req_staging:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=fpw_conn_production:10m;
limit_conn_zone $binary_remote_addr zone=fpw_conn_staging:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name apps.tauasa.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://apps.tauasa.org$request_uri;
    }
}

server {
    # Ubuntu 24.04's nginx is 1.24, which takes http2 on the listen line.
    listen 443 ssl http2;
    server_name apps.tauasa.org;

    ssl_certificate /etc/letsencrypt/live/apps.tauasa.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.tauasa.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Requests carry everything in the query string; there's no body to accept.
    client_max_body_size 1k;
    client_header_timeout 10s;
    # A client that stops reading is dropped after 15 seconds, freeing its app thread.
    send_timeout 15s;

    # Proxy in memory only: no proxy_cache, and nothing spills to temp files.
    proxy_buffering on;
    proxy_buffers 64 16k;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 60s;
    # The app builds links and the cURL command from these, so they're fixed
    # rather than taken from whatever Host header a client sends.
    proxy_set_header Host apps.tauasa.org;
    proxy_set_header X-Forwarded-Host apps.tauasa.org;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = / {
        return 302 /faux-person-web/;
    }

    location = /faux-person-web {
        return 301 /faux-person-web/;
    }

    location /faux-person-web/ {
        limit_req zone=fpw_req_production burst=10 nodelay;
        limit_conn fpw_conn_production 4;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /faux-person-web-staging {
        return 301 /faux-person-web-staging/;
    }

    location /faux-person-web-staging/ {
        limit_req zone=fpw_req_staging burst=10 nodelay;
        limit_conn fpw_conn_staging 4;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        return 404;
    }
}
