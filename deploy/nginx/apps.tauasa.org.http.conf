# apps.tauasa.org before its certificate exists: answers Let's Encrypt's checks
# and nothing else. deploy/install.sh replaces it with apps.tauasa.org.conf once
# certbot has the certificate.
server {
    listen 80;
    server_name apps.tauasa.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
